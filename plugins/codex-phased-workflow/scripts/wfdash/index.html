<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfdash</title>
<!-- Markdown for the Plan tab is rendered by `miniMd` below, which covers the
     vocabulary the plan actually uses. No script comes from the network: this
     page owns the endpoints that queue a request for the chat watching it, so
     anything executing here executes with that authority. A general markdown
     library was tried and dropped — it does not filter link destinations, so a
     `[text](javascript:...)` link written in a plan became a live anchor on
     this origin. `miniMd` escapes everything and never builds an `<a>`.
     Richer rendering means vendoring a library HERE, with its href scheme
     filtered — never a script tag pointing outside. -->
<style>
/* Dark only, by decision (owner, 2026-08-25): one palette to judge instead of
   two, and `color-scheme` so the form controls the browser draws — the date
   inputs of the Off plan bar — follow it instead of arriving white. */
:root{
  color-scheme:dark;
  --bg:#161514; --panel:#1e1d1b; --line:#302e2b; --ink:#eceae6;
  --mut:#9a958d; --accent:#e0824f; --ok:#6aa87c; --warn:#d3a24a; --err:#d9705f;
  --sel:#28261f;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
     font:13px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;
     display:flex;flex-direction:column}

/* Fixed skeleton: header, grid and pane bar never move; only the pane
   content scrolls. The page targets about a third of a window's width. */
header,.gridwrap,.panenav{flex:none}
.panebody{flex:1;overflow-y:auto;padding:10px 12px 30px}

header{border-bottom:1px solid var(--line);padding:7px 12px}
.hrow{display:flex;gap:12px;align-items:baseline;overflow:hidden;white-space:nowrap}
/* the name of the workflow is the subject of the page: it shrinks last, not
   first, and keeps enough room to be read */
h1{font-size:13.5px;margin:0;font-weight:650;overflow:hidden;
  text-overflow:ellipsis;flex:1 1 auto;min-width:130px}
@media (max-width:700px){#hmacro{display:none}}
.m{font-family:var(--mono);font-size:11.5px;color:var(--mut);flex:none}
.m b{color:var(--ink);font-weight:600}
.m.end{margin-left:auto}

/* plan-level tabs, above the grid: what is NOT per phase lives here */
.topnav{flex:none;display:flex;gap:1px;align-items:center;padding:0 8px;
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;
  white-space:nowrap}
.topnav button{background:none;border:1px solid transparent;font:inherit;
  border-radius:6px 6px 0 0;padding:4px 9px;font-size:11.5px;color:var(--mut);
  cursor:pointer;margin-bottom:-1px;flex:none}
.topnav button:hover{color:var(--ink)}
.topnav button[aria-selected=true]{background:var(--panel);
  border-color:var(--line);border-bottom-color:var(--panel);
  color:var(--ink);font-weight:600}
/* Off plan is split like the pane above it: the list keeps its place while the
   detail of the chat picked in it fills the lower half. Only the two halves
   scroll; nothing else on the page moves. */
#offbody{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* `display` beats the `hidden` attribute, so every element that declares one
   has to say this too — otherwise it keeps its share of the height while
   showing nothing. Same trap as `.panenav`. */
#offbody[hidden]{display:none}
.offtop{flex:1 1 50%;display:flex;flex-direction:column;overflow:hidden;
  padding:10px 12px 0}
.offhead{flex:none}
.offlist{flex:1;overflow:auto;padding-bottom:6px}
.offgrid thead th{background:var(--bg)}
.offdet{flex:1 1 50%;overflow:auto;padding:8px 12px 30px;
  border-top:2px solid var(--line);background:color-mix(in srgb,var(--line) 12%,transparent)}

/* the plan grid: fixed-height rows, never wraps; when narrow it scrolls
   horizontally instead of reflowing */
/* only the rows scroll: the column headers stay put, and the grid never grows
   past its share of the height — the pane below keeps its own */
.gridwrap{overflow:auto;max-height:46vh;border-bottom:2px solid var(--line)}
.grid thead th{position:sticky;top:0;z-index:1;background:var(--bg)}
table{border-collapse:collapse;width:100%}
.grid td,.grid th{padding:3px 7px;border-bottom:1px solid var(--line);
  font-size:12px;text-align:left;white-space:nowrap}
.grid th{color:var(--mut);font-weight:500;font-size:10px;
  text-transform:uppercase;letter-spacing:.05em}
.grid td.n,.grid th.n{font-family:var(--mono);text-align:right}
.grid tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--panel)}
.grid tr.selected td{background:var(--sel)}
.grid tr.selected td:first-child{box-shadow:inset 3px 0 var(--accent)}
.grid tr.errow td{background:color-mix(in srgb,var(--err) 8%,transparent)}
.mk{font-family:var(--mono);width:20px;text-align:center}
.mk.x{color:var(--ok)} .mk.e{color:var(--err)} .mk.r{color:var(--accent)}
.mk.h{color:var(--warn)}
/* The title absorbs whatever the numeric columns do not need: they size to
   their content, this one takes the rest and ellipsizes. `max-width:0` is what
   makes the browser hand it the leftover instead of its intrinsic width. */
.ttl{width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis}
tr.next .ttl{font-weight:650}
@media (max-width:700px){.wide{display:none} .m.end{display:none} #hlife{display:none}
  /* the clock did the right-pinning; hidden, the total takes it over */
  #husd{margin-left:auto}}

/* the tree levels: indent and weight, so the hierarchy reads without
   rules and without stealing width from the title */
tr.lv0 .ttl{font-weight:650}
tr.lv1 .ttl{padding-left:15px;font-weight:600}
tr.lv2 .ttl{padding-left:29px}
tr.lv0 td{background:color-mix(in srgb,var(--line) 30%,transparent)}
tr.off .ttl{color:var(--mut)}
/* a closed phase asks for nothing: it dims, its icon does not — the `✓!`
   of one carrying a `> Review:` has to keep catching the eye */
tr.dim .ttl,tr.dim td.n,tr.dim .note,tr.dim .th{color:var(--mut);opacity:.88}
tr.dim .bar{opacity:.85}
.tw{font-family:var(--mono);color:var(--mut);width:14px;text-align:center;
  padding-right:0!important}
.warnflag{color:var(--warn);font-family:var(--mono)}

/* the two bars: progress fills from the left, cost diverges from the
   centre tick, which is 1x the plan median */
.th{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:10.5px;color:var(--mut);white-space:nowrap}
.bar{position:relative;width:64px;height:7px;flex:none;border-radius:3px;
  overflow:hidden;background:color-mix(in srgb,var(--mut) 26%,transparent)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.bar i.mid{background:var(--warn)} .bar i.hot{background:var(--err)}
/* the estimate is drawn weaker than a fact: the label says `est`, the bar
   should not shout louder than the word */
.bar i.est{background:var(--mut);opacity:.75}
#hfasi .bar{width:44px}
/* two bars in a row cost the title 128px: in the grid they are shorter, and
   the figure beside each is what carries the precision anyway */
.grid .bar{width:42px}
.bar u{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;
  background:var(--mut);opacity:.7}

::-webkit-scrollbar{width:6px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-corner{background:var(--bg)}

/* the pane below the grid */
.panenav{display:flex;gap:1px;align-items:center;border-bottom:1px solid var(--line);
  padding:0 8px;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.panenav[hidden]{display:none}
.panenav button{background:none;border:1px solid transparent;font:inherit;
  border-radius:6px 6px 0 0;padding:5px 9px;font-size:12px;color:var(--mut);
  cursor:pointer;margin-bottom:-1px;flex:none}
.panenav button:hover{color:var(--ink)}
.panenav button[aria-selected=true]{background:var(--panel);
  border-color:var(--line);border-bottom-color:var(--panel);
  color:var(--ink);font-weight:600}
.badge{display:inline-block;min-width:15px;margin-left:4px;padding:0 3px;
  border-radius:8px;background:var(--line);font-family:var(--mono);font-size:10px;
  text-align:center;color:var(--ink)}
.badge.err{background:var(--err);color:#fff}
.badge.on{background:var(--accent);color:#fff}

/* sub-tabs of the phase detail */
.subnav{display:flex;gap:1px;align-items:center;border-bottom:1px solid var(--line);
  margin-top:9px}
.subnav button{background:none;border:1px solid transparent;font:inherit;
  border-radius:6px 6px 0 0;padding:4px 9px;font-size:11.5px;color:var(--mut);
  cursor:pointer;margin-bottom:-1px}
.subnav button:hover{color:var(--ink)}
.subnav button[aria-selected=true]{background:var(--panel);
  border-color:var(--line);border-bottom-color:var(--panel);
  color:var(--ink);font-weight:600}

h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);
   font-weight:600;margin:13px 0 5px}
.note{color:var(--mut);font-size:11.5px}
.note b{color:var(--ink)}
.chip{font-family:var(--mono);font-size:9.5px;color:var(--mut);
  border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-left:5px}
.doing{font-family:var(--mono);font-size:11px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.doing b{color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);
  display:inline-block;margin-right:5px;flex:none}
.dot.on{background:var(--accent)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;margin:5px 0 0;font-size:11px;line-height:1.4;
  max-height:60vh;overflow:auto}
.al{padding:3px 9px;margin:3px 0;border-left:3px solid var(--mut);
  background:var(--panel);border-radius:4px;font-size:12px}
.al.error{border-left-color:var(--err)}
.al.warn{border-left-color:var(--warn)}
.al.info{border-left-color:var(--ok)}
.al code{font-family:var(--mono);font-size:11px;color:var(--mut)}
.empty{color:var(--mut);padding:12px 0;font-size:12px}
input[type=search]{font:inherit;font-size:11.5px;background:var(--panel);
  color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;width:100%;max-width:420px;margin-bottom:8px}

/* the Verify: steps, one row each, read-only */
.ck{display:flex;gap:8px;align-items:flex-start;padding:4px 0;
  border-bottom:1px solid var(--line);font-size:12px;line-height:1.45}
.ck:last-child{border-bottom:none}
.ck .wn{font-family:var(--mono);font-size:9.5px;color:var(--mut);
  border:1px solid var(--line);border-radius:4px;padding:0 3px;flex:none;
  margin-top:1px}

/* the steps the agent declared: its own todo list, in its own order. Drawn
   like the trail and never louder — nothing here is certified. */
.steps{margin-top:5px;padding-top:4px;border-top:1px solid var(--line)}
.steps div{display:flex;gap:7px;font-family:var(--mono);font-size:10.5px;
  color:var(--mut);white-space:nowrap;overflow:hidden;line-height:1.55}
.steps .w{flex:none;width:12px;text-align:center;opacity:.8}
.steps .a{overflow:hidden;text-overflow:ellipsis}
.steps .now{color:var(--ink)}
.steps .now .w{color:var(--accent);opacity:1}
.steps .was{text-decoration:line-through;opacity:.7}
/* the lifecycle strip: four stages, each lit by the artifact that proves it */
.life{display:inline-flex;gap:5px;align-items:center}
.life span{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--mut);opacity:.6}
.life span.done{color:var(--ok);opacity:1}
.life span.now{color:var(--accent);opacity:1}
.life u{width:7px;height:1px;background:var(--line);flex:none;
  text-decoration:none}

/* the trail: the agent's recent actions, newest first */
.trail{margin-top:5px;padding-top:4px;border-top:1px solid var(--line)}
.trail div{display:flex;gap:7px;font-family:var(--mono);font-size:10.5px;
  color:var(--mut);white-space:nowrap;overflow:hidden;line-height:1.55}
.trail div:first-child{color:var(--ink)}
.trail .w{flex:none;width:42px;text-align:right;opacity:.75}
.trail .a{overflow:hidden;text-overflow:ellipsis}
.trail b{font-weight:600}

/* agent cards: two fixed lines, nothing wraps */
.ag{border:1px solid var(--line);border-radius:7px;background:var(--panel);
  padding:6px 9px;margin:5px 0}
.ag .l1{display:flex;gap:7px;align-items:baseline;white-space:nowrap;overflow:hidden}
.ag .l1 .nm{font-weight:600;font-size:12px;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:70px}
.ag .l1 .fg{margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:var(--mut);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.ag .l2{display:flex;gap:8px;align-items:center;margin-top:3px;
  white-space:nowrap;overflow:hidden}
.ag.sub{margin-left:16px}
/* the caret and the count are the same control, at the two ends of the line */
.ag .car,.ag .cnt{cursor:pointer;color:var(--mut);font-family:var(--mono);
  font-size:10.5px;flex:none}
.ag .car{width:9px}
.ag .cnt{margin-left:7px}
.ag .car:hover,.ag .cnt:hover{color:var(--ink)}
/* the search takes the room, the two dates keep their own */
.offbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:5px 0}
.offbar #fq{flex:1 1 180px}
.offbar label{font-size:11px;color:var(--mut);display:flex;gap:4px;
  align-items:center;flex:none}
.offbar input[type=date]{font:inherit;font-family:var(--mono);font-size:11px;
  color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:3px 6px}
.offbar a{color:var(--accent);font-size:11px;cursor:pointer;flex:none}
.offgrid td.st{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
.offgrid .ttl .dot{margin-right:6px}
.offgrid .ttl .note{font-size:11px}
.offgrid .ttl{padding-left:2px}
.meter{margin-left:8px}
/* the stage of a macro-phase: the one it is ON, in one word. The colour walks
   from muted to the accent as the lifecycle advances, and closes on ok. */
.stg{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;padding:1px 5px;border-radius:4px;
  background:color-mix(in srgb,var(--mut) 18%,transparent)}
td.stg-cell{white-space:nowrap}
.stg.s0,.stg.s1{color:var(--mut)}
.stg.s2{color:var(--accent)} .stg.s3{color:var(--warn)}
.stg.s4{color:var(--ok)}
/* one phase per line in the macro-phase pane: a list to pick from, not cards */
.mrow{display:flex;gap:8px;align-items:baseline;padding:4px 2px;cursor:pointer;
  border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.mrow:hover{background:var(--panel)}
.mrow .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.mrow .w{font-family:var(--mono);font-size:10.5px;color:var(--mut);flex:none}
.phead .t{font-size:13px;font-weight:650}
.phead .m{display:block;white-space:normal;margin-top:2px}

/* the mirror: the foreman's head, the exchange, the box that writes. Only
   this view splits the pane — the talk scrolls, the writer never moves. */
.panebody.split{display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:12px}
.fmhead{display:flex;gap:7px;align-items:baseline;white-space:nowrap;
  overflow:hidden;flex:none}
.fmhead .nm{font-weight:650;font-size:12.5px;overflow:hidden;
  text-overflow:ellipsis}
.fmhead .st{margin-left:auto;font-family:var(--mono);font-size:10.5px;
  color:var(--mut);flex:none}
.fmhead .st.off{color:var(--warn)}
.talk{flex:1;overflow-y:auto;min-height:0;margin-top:8px;
  border-top:1px solid var(--line)}
.msg{padding:7px 0;border-bottom:1px solid var(--line)}
.msg .who{display:flex;gap:6px;align-items:baseline;font-family:var(--mono);
  font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.msg .who b{color:var(--ink);font-weight:600;letter-spacing:0;
  text-transform:none;font-size:10.5px}
.msg .who .w{margin-left:auto}
.msg .tx{font-size:12px;line-height:1.5;margin-top:3px;white-space:pre-wrap;
  overflow-wrap:anywhere}
.msg.sent .tx{color:var(--mut)}
.msg.sent .who b{color:var(--accent)}
.writer{flex:none;padding-top:9px}
textarea{font:inherit;font-size:12px;width:100%;min-height:58px;resize:vertical;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 8px}
textarea:disabled{opacity:.55}
.wrow{display:flex;gap:8px;align-items:center;margin-top:6px}
/* the status says what to do about it, so it wraps rather than losing its
   second half to an ellipsis */
.wrow .st{font-size:11.5px;color:var(--mut);line-height:1.35}
.wrow .st.err{color:var(--err)}
.wrow .st.ok{color:var(--ok)}
button.go{font:inherit;font-size:11.5px;padding:4px 12px;cursor:pointer;
  border:1px solid var(--line);border-radius:6px;background:var(--panel);
  color:var(--ink);font-weight:600;flex:none;margin-left:auto}
button.go:disabled{opacity:.5;cursor:default}

/* the no-plan state: one sentence and one button, because the questions
   belong in the dialog the button opens */
.noplan{padding:2px}
.noplan .t{font-size:13px;font-weight:650;margin:0 0 6px}
.noplan .note{margin:6px 0}

/* the dialog that asks the questions */
dialog.dlg{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  color:var(--ink);padding:0;width:min(340px,calc(100% - 24px));
  box-shadow:0 10px 34px rgba(0,0,0,.28)}
dialog.dlg::backdrop{background:rgba(0,0,0,.42)}
dialog.dlg:focus{outline:none}
.who1{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:0}
.dlg h3{margin:0;padding:10px 13px;font-size:12.5px;font-weight:650;
  border-bottom:1px solid var(--line)}
.dlg .body{padding:11px 13px}
.f{display:flex;gap:8px;align-items:center;margin:8px 0}
.f label{font-family:var(--mono);font-size:10.5px;color:var(--mut);
  width:52px;flex:none;text-align:right}
.f input,.f select,.f textarea{font:inherit;font-size:12px;flex:1;min-width:0;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:4px 7px}
.f textarea{min-height:44px;resize:vertical;line-height:1.4}
.f.top label{align-self:flex-start;margin-top:5px}
.hint{font-size:11px;color:var(--mut);margin:1px 0 0 60px;line-height:1.35}
.hint a{color:var(--accent);cursor:pointer}
/* the status takes a line of its own: sharing the row with two buttons left
   it three words wide, and what it says is what to do next */
.dlg .foot{display:flex;gap:8px;align-items:center;justify-content:flex-end;
  flex-wrap:wrap;padding:10px 13px;border-top:1px solid var(--line)}
.dlg .foot .st{font-size:11.5px;color:var(--mut);line-height:1.35;
  flex:1 0 100%;margin-bottom:2px}
.dlg .foot .st.err{color:var(--err)}
.dlg .foot .st.ok{color:var(--ok)}
button.ghost{font:inherit;font-size:11.5px;padding:4px 10px;cursor:pointer;
  border:1px solid transparent;border-radius:6px;background:none;
  color:var(--mut);flex:none}
.dlg .foot .go{margin-left:0}
.sep{display:flex;gap:8px;align-items:center;margin:14px 0 6px;
  font-family:var(--mono);font-size:10px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.06em}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.cmd{display:flex;gap:7px;align-items:center;margin:4px 0;
  border:1px solid var(--line);border-radius:7px;background:var(--bg);
  padding:6px 8px}
.cmd code{font-family:var(--mono);font-size:11px;flex:1;
  overflow-x:auto;white-space:nowrap}
.cmd button{font:inherit;font-size:11px;padding:3px 9px;cursor:pointer;
  border:1px solid var(--line);border-radius:5px;background:var(--panel);
  color:var(--ink);flex:0 0 auto}
/* the launch sits between the phase head and its sub-tabs, boxed off: it is
   the one thing on the pane that starts work rather than reporting it */
.launch{border:1px solid var(--line);border-radius:8px;background:var(--panel);
  padding:8px 10px;margin:8px 0 2px}
.launch .wrow{margin-top:0;flex-wrap:wrap}
/* both are actions, so neither is pushed to the far side, and the secondary
   one keeps a border: a ghost button with none reads as disabled */
.launch .wrow .go{margin-left:0}
.launch .wrow .ghost{border-color:var(--line);color:var(--ink)}
.launch .wrow .st{flex:1 0 100%;order:3}
.launch .note{margin:7px 0 0}
.launch .note code{font-family:var(--mono);font-size:10.5px}
/* the plan wraps: it is prose, and a horizontal scrollbar over prose is a way
   of not reading it */
pre.plan{white-space:pre-wrap;word-break:break-word;max-height:none;
  font-size:11.5px;line-height:1.5}
.pbar{display:flex;gap:10px;align-items:center;margin:2px 0 8px;flex-wrap:wrap}
/* a two-way switch, the same shape as the sub-tabs above it */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;
  overflow:hidden;flex:none}
.seg button{font:inherit;font-size:11px;padding:2px 9px;cursor:pointer;
  background:none;border:none;color:var(--mut)}
.seg button[aria-selected=true]{background:var(--panel);color:var(--ink);
  font-weight:600}
.seg button:disabled{opacity:.4;cursor:default}
.pbar .w{font-size:10.5px;color:var(--mut)}
/* Prose, so it is set as prose: bigger than the grid's figures, a measure that
   stops before the eye loses the line on a wide window, and air between the
   fields — packed, a page of them reads as one block. */
.plan.md{font-size:13px;line-height:1.65;overflow-wrap:anywhere;max-width:78ch}
.plan.md h1,.plan.md h2,.plan.md h3{font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--mut);margin:12px 0 4px;font-weight:600}
.plan.md p,.plan.md li,.pline{margin:4px 0}
.plan.md ul{margin:4px 0;padding-left:18px}
.plan.md code,.pfield code,.pnote code,.pph code{font-family:var(--mono);
  font-size:11px;background:var(--panel);padding:1px 4px;border-radius:4px}
.pph{font-weight:600;margin:10px 0 2px}
.pph .mk{font-family:var(--mono);color:var(--accent);margin-right:6px}
/* the label leads on its own line: `Decisions:` in front of a paragraph of
   twelve lines was a word the eye slid past */
.pfield,.pnote{margin:0 0 14px;padding-left:12px;border-left:2px solid var(--line)}
.pnote{border-left-color:var(--accent)}
.pfield b,.pnote b{display:block;color:var(--mut);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.pbar .seg button .c{color:var(--mut);font-family:var(--mono);font-size:10px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 id="slug">wfdash</h1>
    <span class="m" id="hfasi"></span>
    <span class="m" id="hlife"></span>
    <span class="m" id="hatt"></span>
    <span class="m" id="husd"></span>
    <span class="m end" id="clock"></span>
  </div>
</header>
<nav class="topnav" id="topnav"></nav>
<div class="gridwrap">
  <table class="grid">
    <thead><tr><th></th><th></th><th>phase</th><th>stage</th><th>progress</th>
      <th class="n wide">chats</th><th class="n wide">turns</th>
      <th class="n wide">output</th><th class="wide">run</th>
      <th class="n wide">vs med</th><th class="n">$</th></tr></thead>
    <tbody id="gridbody"></tbody>
  </table>
</div>
<nav class="panenav" id="panenav"></nav>
<div class="panebody" id="panebody"></div>
<div id="offbody" hidden></div>
<dialog class="dlg" id="nfdlg"></dialog>

<script>
const TRAIL_SHOWN=6;
// What a macro-phase's state means, in the words its own rule uses: the state
// is read from where the plan directory sits, never judged here.
// The stage a macro-phase has reached, from the same disk facts its state
// comes from. Scoping leaves no artifact, so a macro with no plan directory is
// shown as scoping by elimination, never by a signal. The quality check has a
// signal — the `> Quality check:` line in plan.md — that core.py does not read
// yet, so `executed` covers both "waiting for it" and "it ran".
const STAGE={none:['scoping','s0'], planned:['planned','s1'],
  executing:['executing','s2'], executed:['executed','s3'],
  finalized:['finalized','s4']};

const MACRO_STATE={done:'closed — its plan is under .phased/done/',
  active:'in progress — its plan is under .phased/active/',
  none:'not started — no plan directory'};
let level='plan';
let S=null, pane='phase', phase=null, phaseSlug=null, sub='ov', logCache={}, offFilter='';
// The macro-phase selected in the grid, if any. Selection is exclusive with a
// phase: one row is picked, and the pane below says what that row is.
let macroSel=null;
// The chat selected in the Off plan grid, whose detail fills the lower half.
let offSel=null;
// The date window of the Off plan list. Empty means unbounded on that side.
let offFrom='', offTo='';
// The mirror: the foreman's side of the channel, and what is being written to
// it. `draft` lives here because the pane is rebuilt on every poll.
let mirror=null, draft='', sending=false, sendMsg='', sendCls='', talkLen=-1, talkTop=0;
// The no-plan form. `sessions` is null until the server has published its list:
// the page can only offer what came from there.
let nf={name:'',scope:'',owner:null,msg:'',cls:'',sending:false};
// The launch. Nothing here holds a run: the server proposes, the chat runs.
let launching='', launchMsg='', launchCls='', launchCmd='';
// The plan's own words, keyed `<slug>:<phase>` — `r:<macro>` for a roadmap
// section. A cached copy is re-read only when the state tick reports a new
// mtime, so a rewritten plan does not stay stale for the life of the page.
let planText={}, planStamp={}, planLoading=new Set();
let planView='planned';                // planned | executed | raw
let macroSub='ov';                     // the macro-phase pane: ov | plan
let macroPlanView='roadmap';           // inside it: roadmap | plan
// The chats whose subagents are shown. Closed is the default: a chat with a
// dozen of them buried its own line, and the count on the caret says what is
// behind it.
// No credential is written here on purpose. The server sets an HttpOnly
// session cookie on the one navigation that spends the URL key, and the browser
// attaches it to every same-origin request by itself — so the page holds no
// token to be read out of it. It used to sit in a <meta> tag, which is exactly
// how any local process lifted it with one unauthenticated GET. Do not put it
// back in the markup or in a fetch header.
let openChats=new Set();
// Which tree nodes are open. Filled on the first state: root and the
// running macro-phase open, the rest closed.
let openNodes=null;

const k=n=>{n=+n||0;
  if(Math.abs(n)>=1e9)return (n/1e9).toFixed(1)+'G';
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+'M';
  if(Math.abs(n)>=1e3)return (n/1e3).toFixed(1)+'k';
  return String(Math.round(n));};
const dur=s=>{s=Math.max(0,Math.round(s));
  if(s<90)return s+'s';
  if(s<5400)return Math.round(s/60)+'m';
  if(s<172800)return (s/3600).toFixed(1)+'h';
  return Math.round(s/86400)+'d';};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=ts=>ts?dur((Date.now()-Date.parse(ts))/1000):'—';
const pl=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
// Absolute time, written the way a date input reads it: the relative `3d ago`
// answers "is it recent", never "was it that Tuesday".
const stamp=ts=>{if(!ts)return '—';const d=new Date(ts);if(isNaN(d))return '—';
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${
    p(d.getHours())}:${p(d.getMinutes())}`;};
const dayOf=ts=>ts?stamp(ts).slice(0,10):'';

function shortName(name){
  const slug=S.plan&&S.plan.slug;
  return slug?String(name).replace('wf:'+slug+':','wf:…:'):name;
}
function chatsOf(n){
  const ids=(S.groups.by_phase[String(n)]||[]);
  return S.chats.filter(c=>ids.includes(c.session_id));
}
function figures(n){
  const f={chats:0,turns:0,out:0,read:0,usd:0};
  chatsOf(n).forEach(c=>{f.chats++;
    [c,...c.subagents].forEach(a=>{f.turns+=a.turns;f.out+=a.output;
      f.read+=a.reread;f.usd+=a.usd;});});
  return f;
}
// Two bars, never one doing both jobs: the first says how far the phase got,
// the second what it cost. A single fill was read as progress, which is what
// it never was.
function costBar(ratio){
  // Diverging around the plan median: the tick at the centre is 1.0x, left is
  // cheaper, right dearer. A fill running to the end used to mean twice the
  // median, and looked like completion.
  const med=S.plan&&S.plan.median_ratio;
  if(!med||!ratio)return '';
  // Half a bar is a 50% deviation, not a 100% one: the phases that exist sit
  // between 0.7x and 1.5x, and mapping 2.0x to the edge left them a few pixels.
  // It saturates where the colour already turns, at 1.5x.
  const rel=ratio/med, p=Math.min(1,Math.max(0,.5+(rel-1)));
  const cls=rel>1.5?'hot':(rel>1.05?'mid':'');
  // A phase exactly at the median deviates by nothing, and a zero-width fill
  // is indistinguishable from a missing one: it keeps a sliver at the tick.
  return `<span class="th"><span class="bar"><i class="${cls}" style="left:${
    (Math.min(p,.5)*100).toFixed(1)}%;width:${
    Math.max(1.5,Math.abs(p-.5)*100).toFixed(1)}%"></i><u></u></span>${
    rel.toFixed(1)+'x'}</span>`;
}

function medianOut(){
  // The yardstick of the estimate: what a closed phase of THIS plan cost in
  // output. No closed phase yet, no estimate — an invented one is worse.
  const p=S.plan;
  if(!p)return 0;
  const v=p.phases.filter(f=>f.status==='x'&&f.mine!==false)
    .map(f=>figures(f.n).out).filter(x=>x>0).sort((a,b)=>a-b);
  if(!v.length)return 0;
  const h=v.length>>1;
  return v.length%2?v[h]:(v[h-1]+v[h])/2;
}

function fillBar(done,total,label){
  // A plain fill over a countable whole: macro-phases in the header, phases on
  // a macro row. Nothing is estimated here — both numbers are facts.
  return `<span class="th"><span class="bar"><i style="width:${
    (total?done/total*100:0).toFixed(0)}%"></i></span>${
    label?label+' ':''}<b>${done}/${total}</b></span>`;
}

// The steps the agent declared for itself. Always an estimate, and labelled
// one: the list is the agent's, at the agent's grain, and it may be stale. A
// `completed` item that goes back to `in_progress` moves the bar backwards —
// that is a retreat, which is a thing worth seeing.
function stepBar(t){
  return `<span class="th"><span class="bar"><i class="est" style="width:${
    (t.total?t.done/t.total*100:0).toFixed(0)}%"></i></span><b>${
    t.done}/${t.total}</b> est</span>`;
}
// The chat of a phase that declared a list. Several chats are not summed: two
// todo lists are written at two grains, and their sum measures nothing. The
// most recently active one that declares is the one working now.
function stepsOf(n){
  const c=chatsOf(n).find(x=>x.todos);
  return c?c.todos:null;
}

function progressBar(status,out){
  // Closed is full and says so. Anything that has produced output without
  // closing gets an estimate, capped below the end so it never reads as done.
  // The rest is empty — and an empty bar with no figure is "not started", not
  // zero progress.
  if(status==='x')
    return `<span class="th"><span class="bar"><i style="width:100%"></i></span>done</span>`;
  const med=medianOut();
  if(!out||!med)return `<span class="th"><span class="bar"></span>—</span>`;
  const pct=Math.min(95,out/med*100);
  return `<span class="th"><span class="bar"><i class="est" style="width:${
    pct.toFixed(0)}%"></i></span>~${pct.toFixed(0)}% est</span>`;
}

function head(){
  // The first line names the WORKFLOW. With a roadmap that is the roadmap, and
  // the macro-phases are its own count; the active plan's phases follow, since
  // "stuck on 8" is the thing most often looked for. The roadmap therefore has
  // no row in the grid: it is the page's subject, not a node inside it.
  const p=S.plan, tree=S.tree, macros=(tree&&tree.roadmap)?
    (tree.nodes||[]).filter(n=>n.kind==='macro'):null;
  const label=(tree&&tree.label)||(p?p.slug:'no plan');
  const h1=document.getElementById('slug');
  h1.textContent=label;
  h1.title=label;                       // the full name, when the header trims it
  // The workflow's own thermometer counts MACRO-phases and nothing else. With
  // no roadmap the whole plan IS the single macro, so it counts its phases.
  // Each macro row carries its own bar over its own phases; two bars up here
  // would be the same measure twice, at two grains.
  const bits=[];
  if(macros&&macros.length){
    const done=macros.filter(n=>n.state==='done').length;
    bits.push(fillBar(done,macros.length,'macros'));
  }else if(p){
    bits.push(fillBar(p.done,p.total,'phases'));
  }
  if(p&&macros&&macros.length)
    bits.push(`phases <b>${p.done}/${p.total}</b>`);
  if(p)bits.push(recoLine(p));
  document.getElementById('hfasi').innerHTML=bits.join(' · ');
  // The lifecycle of the workflow: four stages, each lit by the artifact that
  // proves it, in the order they happen. Nothing here is a forecast — a stage
  // with no artifact is simply not lit.
  // With no plan active the strip belongs to the last finalized workflow: all
  // four stages true, including the one no active plan can ever prove.
  const life=(S.plan&&S.plan.lifecycle)||(S.finished&&S.finished.lifecycle)||null;
  document.getElementById('hlife').innerHTML=life?
    `<span class="life">${life.map(g=>`<span class="${g.state}" title="${
      esc(g.proof||'no artifact yet')}">${esc(g.label)}</span>`).join('<u></u>')}</span>`:'';
  const telemetry=S.totals.available!==false;
  document.getElementById('hatt').innerHTML=telemetry?
    `<b>${S.totals.active}</b>/${S.totals.agents} active`:'<b>—</b> task feed';
  // A model missing from the price table contributes tokens and no dollars, so
  // the total is a floor, not a figure. Saying which model is what makes it
  // actionable — the table is a constant in core.py and goes stale.
  const unp=S.totals.unpriced||[];
  document.getElementById('husd').innerHTML=telemetry?
    (`<b>$${S.totals.usd.toFixed(2)}</b>`
      +(unp.length?` <span class="warnflag" title="no price for ${unp.map(esc).join(', ')} — these add tokens and no dollars, so the total is a floor">+?</span>`:'')):
    '<b>—</b> cost';
}

function stageOf(n){
  if(n.state==='done')return 'finalized';
  if(n.state!=='active'&&!n.slug)return 'none';
  if(!n.phases.length)return 'planned';
  return n.phases.every(f=>f.status==='x')?'executed':'executing';
}

function nodeKey(n){return n.slug?('s:'+n.slug):('m:'+n.n);}
function archived(n){return n.kind==='plan'&&n.state==='done';}
function archivedNodes(){return ((S.tree&&S.tree.nodes)||[]).filter(archived);}
function nodeFigures(n){
  // A macro-phase row carries the sum of its attributed phases. No
  // No cost bar: the median comparison is per phase, not per plan.
  const f={chats:0,turns:0,out:0,usd:0};
  n.phases.forEach(p=>{if(!p.mine)return;const g=figures(p.n);
    f.chats+=g.chats;f.turns+=g.turns;f.out+=g.out;f.usd+=g.usd;});
  return f;
}
function initOpen(){
  if(openNodes||!S.tree)return;
  openNodes=new Set();
  (S.tree.nodes||[]).forEach(n=>{if(n.state==='active')openNodes.add(nodeKey(n));});
}
function cells(o){
  // Progress opens the row, cost closes it: what was done first, what it cost
  // last, and the counts in between.
  return `<td class="stg-cell">${o.stage?`<span class="stg ${
      STAGE[o.stage][1]}">${STAGE[o.stage][0]}</span>`:''}</td>
    <td>${o.frac?fillBar(o.frac[0],o.frac[1]):
      o.steps?stepBar(o.steps):
      (o.status===undefined?'':progressBar(o.status,o.out))}</td>
    <td class="n wide">${o.chats||'—'}</td>
    <td class="n wide">${o.turns||'—'}</td>
    <td class="n wide">${o.out?k(o.out):'—'}</td>
    <td class="wide note">${esc(o.run||'')}</td>
    <td class="n wide">${o.ratio&&S.plan&&S.plan.median_ratio?
      (o.ratio/S.plan.median_ratio).toFixed(1)+'x':'—'}</td>
    <td class="n">${o.usd?o.usd.toFixed(2):'—'}</td>`;
}
// The five outcomes next-phase.py reports. The header used to build a two-way
// sentence out of blocked_by alone, so four of them never reached a person.
function recoLine(p){
  const r=p.recommendation||'';
  if(r.startsWith('next: '))return `next <b>${p.next}</b>`;
  if(r.startsWith('resume-candidate: '))
    return `resume <b>${esc(r.slice(18).split(' ')[0])}</b>`;
  if(r.startsWith('attention: '))return `attention <b>${esc(r.slice(11))}</b>`;
  if(r.startsWith('blocked: '))return `<span title="${esc(r.slice(9))}">stuck on ${
    p.blocked_by!=null?`<b>${p.blocked_by}</b>`:'the plan'}</span>`;
  if(r==='done')return 'all closed';
  return r?esc(r):'no recommendation';
}
// A phase's tags ride in their own payload field since the single reader took
// over the parsing; describe() renders them backticked, so the page does too.
function tagChips(f){
  return (f.tags||[]).map(t=>`<span class="chip">\`${esc(t)}\`</span>`).join('');
}
function phaseRow(f,slug){
  // Figures exist only for the active plan: a chat carries its plan's slug
  // in its title, and another plan's chats stay unattributed.
  const g=f.mine?figures(f.n):{};
  const sel=(f.n===phase&&slug===phaseSlug);
  return `<tr class="lv2 ${sel?'selected ':''}${f.status==='!'?'errow ':''}${
      f.mine&&S.plan&&f.n===S.plan.next?'next ':''}${f.status==='x'?'dim ':''}${
      f.mine?'':'off'}"
      data-n="${f.n}" data-slug="${esc(slug||'')}">
    <td class="tw"></td><td class="mk ${f.cls||''}">${f.icon||''}</td>
    <td class="ttl">${f.n} · ${esc(f.title)}${tagChips(f)}${
      f.warn?' <span class="warnflag" title="errori API">⚠</span>':''}</td>
    ${cells({status:f.status,ratio:g.out?g.read/g.out:0,usd:g.usd,
             chats:g.chats,turns:g.turns,out:g.out,run:f.run,
             steps:f.mine&&f.status==='>'?stepsOf(f.n):null})}</tr>`;
}
function grid(){
  const el=document.getElementById('gridbody'), tree=S.tree;
  if(!S.plan&&!(tree&&tree.nodes.length)){
    el.innerHTML='<tr><td colspan="11" class="empty">no plan in .phased/active/'
      +' — the Phase tab carries the button that creates one</td></tr>';return;}
  initOpen();
  const rows=[], arch=(level==='done');
  if(!arch&&!tree.roadmap){
    (tree.phases||[]).forEach(f=>rows.push(phaseRow(f,S.plan&&S.plan.slug)));
  }else{
    tree.nodes.filter(n=>archived(n)===arch).forEach(n=>{
      const on=openNodes.has(nodeKey(n));
      const lab=(n.n!=null?`M${n.n} · `:'')+n.title;
      rows.push(`<tr class="lv1 ${n.state==='done'?'dim ':''}${
        nodeKey(n)===macroSel?'selected':''}" data-node="${esc(nodeKey(n))}">
        <td class="tw">${n.phases.length?(on?'▾':'▸'):''}</td>
        <td class="mk ${n.cls}">${n.icon}</td>
        <td class="ttl" title="${esc(n.mini_scope||'')}">${esc(lab)}</td>
        ${cells(Object.assign(nodeFigures(n),{stage:stageOf(n)},
          n.phases.length?{frac:[n.phases.filter(f=>f.status==='x').length,
                                n.phases.length]}:{}))}</tr>`);
      if(on)n.phases.forEach(f=>rows.push(phaseRow(f,n.slug)));
    });
  }
  el.innerHTML=rows.join('');
  // The caret collapses, the rest of the row selects: a macro-phase is a thing
  // to read, not only a container to fold away.
  el.querySelectorAll('tr[data-node]').forEach(r=>{
    r.onclick=()=>{macroSel=r.dataset.node;pane='phase';render();};
    const tw=r.querySelector('.tw');
    if(tw)tw.onclick=e=>{e.stopPropagation();
      const key=r.dataset.node;
      openNodes.has(key)?openNodes.delete(key):openNodes.add(key);render();};});
  el.querySelectorAll('tr[data-n]').forEach(r=>r.onclick=()=>{
    macroSel=null;phase=+r.dataset.n;phaseSlug=r.dataset.slug||null;
    pane='phase';render();});
}

function nav(){
  const nAct=S.totals.active, nOff=S.groups.off_plan.length;
  const nErr=S.alerts.filter(a=>a.level==='error').length, nAl=S.alerts.length;
  // Done appears only when finalized workflows from past roadmaps exist.
  const nArch=archivedNodes().length;
  const tops=[['plan','Plan',''],
    ...(nArch?[['done','Done',`<span class="badge">${nArch}</span>`]]:[]),
    ['off','Off plan',nOff?`<span class="badge">${nOff}</span>`:'']];
  document.getElementById('topnav').innerHTML=tops.map(([id,lab,b])=>
    `<button data-t="${id}" aria-selected="${level===id}">${lab}${b}</button>`).join('');
  document.querySelectorAll('#topnav button').forEach(b=>
    b.onclick=()=>{level=b.dataset.t;render();});
  const tabs=[['phase','Phase',''],['mirror','Foreman',''],
    ['active','Active',nAct?`<span class="badge on">${nAct}</span>`:''],
    ['alerts','Alerts',nAl?`<span class="badge${nErr?' err':''}">${nAl}</span>`:'']];
  document.getElementById('panenav').innerHTML=tabs.map(([id,lab,b])=>
    `<button data-p="${id}" aria-selected="${pane===id}">${lab}${b}</button>`).join('');
  document.querySelectorAll('#panenav button').forEach(b=>
    b.onclick=()=>{pane=b.dataset.p;render();if(pane==='mirror')loadMirror();});
}

function agCard(a,isSub){
  const l2=[];
  if(a.output&&S.plan&&S.plan.median_ratio)l2.push(costBar(a.ratio));
  if(a.task)l2.push(`<span class="doing">${esc(a.task)}</span>`);
  else if(a.doing)l2.push(`<span class="doing"><b>${esc(a.doing.name)}</b> ${
    esc(a.doing.arg)}</span>`);
  if(a.todos&&a.todos.active_form)
    l2.push(`<span class="doing">${esc(a.todos.active_form)}</span>`);
  const tr=(a.trail||[]).slice(0,TRAIL_SHOWN);
  const trail=tr.length>1?`<div class="trail">${tr.map(x=>
    `<div><span class="w">${x.ago_s!=null?dur(x.ago_s):'—'}</span>
      <span class="a"><b>${esc(x.name)}</b> ${esc(x.arg)}</span></div>`).join('')}</div>`:'';
  // The list itself, in the agent's own order: what it says it will do, what
  // it says it is doing, what it says it has done. A struck-through line is a
  // step it declared finished — and it may come back.
  const steps=a.todos?`<div class="steps">${a.todos.items.map(t=>
    `<div class="${t.status==='in_progress'?'now':(t.status==='completed'?'was':'')}">
      <span class="w">${t.status==='completed'?'✓':(t.status==='in_progress'?'▸':'·')}</span>
      <span class="a">${esc(t.subject)}</span></div>`).join('')}</div>`:'';
  return `<div class="ag${isSub?' sub':''}">
    <div class="l1"><span class="dot${a.active?' on':''}"></span>
      <span class="nm">${esc(shortName(a.name))}</span>
      ${a.kind==='chat'?'<span class="chip">chat</span>':''}
      <span class="fg">${pl(a.turns,'turn')} · ${k(a.output)} · $${a.usd.toFixed(2)}</span></div>
    ${l2.length?`<div class="l2">${l2.join('')}</div>`:''}${steps}${trail}</div>`;
}

function chatBlock(c,card){
  // A chat and the subagents it spawned, as one collapsible block. The caret
  // belongs to the parent; a chat that spawned nothing does not get one.
  const subs=c.subagents||[];
  if(!subs.length)return card;
  const on=openChats.has(c.session_id);
  return card.replace('<span class="nm">',
    `<span class="car" data-chat="${esc(c.session_id)}">${on?'▾':'▸'}</span><span class="nm">`)
    .replace('</div>', `<span class="cnt" data-chat="${esc(c.session_id)}">${
      pl(subs.length,'subagent')}</span></div>`)
    + (on?subs.map(s=>agCard(s,true)).join(''):'');
}

function phaseAlerts(n){
  return S.alerts.filter(a=>a.phase===n).map(a=>
    `<div class="al ${a.level}">${esc(a.text)}</div>`).join('');
}

const STATE={' ':'not run yet','x':'closed','!':'failed',
  '~':'blocked','>':'running'};

function checkRows(f){
  // Read-only: the ok on a Verify: step is given in the conversation, to
  // /close-phase. Recording it here would be a second source of truth.
  if(!(f.checks||[]).length)return '<p class="empty">no Verify: check on this phase</p>';
  return f.checks.map(c=>
    `<div class="ck"><span class="t">${esc(c.text)}</span>
      <span class="wn">${esc(c.when||'now')}</span></div>`).join('');
}

function notesOf(f){
  return f.notes&&f.notes.length?f.notes.map(n=>
    `<p class="note" style="margin:5px 0 0"><b>${esc(n.kind)}:</b> ${esc(n.text)}</p>`).join(''):
    '<p class="empty">no note on this phase</p>';
}

function viewOtherPhase(){
  const node=(S.tree.nodes||[]).find(n=>n.slug===phaseSlug);
  const f=node&&node.phases.find(x=>x.n===phase);
  if(!f)return '<p class="empty">no phase selected</p>';
  // A closed plan no longer has its directory in the working tree: it was
  // read from the branch that produced it, so the notes remain, the agents do not.
  const src=node.branch?`plan <b>${esc(node.slug)}</b> read from <b>${esc(node.branch)}</b>`:
    `plan <b>${esc(node.slug)}</b>, not the open one`;
  return `<div class="phead"><span class="t"><span class="mk ${f.cls}">${f.icon}</span>
    phase ${f.n} — ${esc(f.title)}</span>
    <span class="m note">${STATE[f.status]||''} · ${esc(f.run||'')} · ${src}</span></div>
    <h2>phase notes</h2>${notesOf(f)}
    <p class="empty">Agents, log and ticks exist only for the open plan.</p>`;
}

// No plan in .phased/active/. The questions live in a dialog, so the pane
// says one thing and offers one button — a repo with no workflow has nothing
// to read, and a form standing open is a form nobody asked for.
//
// The recipient is normally not asked at all: `/dashboard` tells the server
// the id of the Codex task that ran it, so the proposal stays owned by the task
// the person is already using.
// What the button sends, character for character. server.py builds
// `/write-workflow <name>` and appends ` — <scope>` only when scope is
// filled; rendering the placeholder here instead meant the box on screen and
// the command on the wire were two different strings, and whoever copied the
// box sent a literal `<scope>` as the scope of their workflow.
function newWorkflowCmd(){
  const n=nf.name.trim()||'<name>', s=nf.scope.trim();
  return `/write-workflow ${n}` + (s?` — ${s}`:'');
}
function viewNoPlan(){
  // The lifecycle strip in the header belongs to the last finalized workflow,
  // so this says which one: four green stages beside "no plan" name nothing on
  // their own. Nothing here acts on it — it is finished, and the Create form is
  // still the only thing this state offers.
  const f=S.finished;
  const last=f?`<p class="note">Last finished here: <b>${esc(f.slug)}</b> —
      ${f.total} phase${f.total===1?'':'s'}, all closed. The strip above is its
      own; its plan is kept on the workflow branch.</p>`:'';
  return `<div class="noplan">
    <p class="t">No active workflow for this repo. Create one?</p>
    <p class="note">Nothing to read here yet. The button asks for a name and a
      scope, and sends the command that writes the plan.</p>
    ${last}
    <div class="wrow"><button class="go" id="nfopen">Create</button></div>
  </div>`;
}

function nfDialog(){
  // There is nobody to choose any more: the request is queued for the Codex
  // task that opened this dashboard, and that task writes the plan. The row names
  // it when the server could resolve it, and says so plainly when it could not.
  const owner=nf.owner;
  const to=`<div class="f"><label>queued for</label>
      <span class="who1">${owner?esc(shortName(owner.name)):
        'the Codex task that opened this dashboard'}</span></div>
     <p class="hint">${owner?'':'the owner is unknown — copy the command instead. '
       }the request waits in the queue until that task serves it</p>`;
  const ready=nf.name.trim()&&!nf.sending;
  return `<h3>New workflow</h3>
    <div class="body">
      <div class="f"><label>name</label>
        <input id="nfname" value="${esc(nf.name)}" placeholder="short-slug"></div>
      <p class="hint">the slug of the plan and of its branch — kebab-case, short</p>
      <div class="f top"><label>scope</label>
        <textarea id="nfscope" placeholder="what the workflow covers">${esc(nf.scope)}</textarea></div>
      <p class="hint">in a line or two — the objective, not the steps</p>
      ${to}
      <div class="sep">or copy it</div>
      <div class="cmd"><code id="wfcmd">${esc(newWorkflowCmd())}</code>
        <button id="wfcopy">copy</button></div>
    </div>
    <div class="foot">
      ${nf.msg?`<span class="st ${esc(nf.cls)}">${esc(nf.msg)}</span>`:''}
      <button class="ghost" id="nfcancel">cancel</button>
      <button class="go" id="nfsend"${ready?'':' disabled'}>${
        nf.sending?'queueing…':'create workflow'}</button>
    </div>`;
}

function renderDialog(){
  const d=document.getElementById('nfdlg');
  if(!d.open)return;
  const keep=focused();
  d.innerHTML=nfDialog();
  d.querySelector('#nfcancel').onclick=()=>d.close();
  ['name','scope'].forEach(f=>{const i=document.getElementById('nf'+f);
    if(i)i.oninput=()=>{nf[f]=i.value;renderDialog();};});
  d.querySelector('#nfsend').onclick=sendNewFlow;
  const cp=document.getElementById('wfcopy');
  cp.onclick=async()=>{
    // A page served over plain http gets no clipboard API outside a secure
    // context, and 127.0.0.1 counts as one — but the fallback stays, so the
    // command is still selectable when the write is refused.
    try{await navigator.clipboard.writeText(newWorkflowCmd());cp.textContent='copied';}
    catch(e){getSelection().selectAllChildren(document.getElementById('wfcmd'));
      cp.textContent='select and copy';}};
  refocus(keep);
}

function viewMacro(){
  const n=(S.tree.nodes||[]).find(x=>nodeKey(x)===macroSel);
  if(!n)return '<p class="empty">that macro-phase is gone</p>';
  const g=nodeFigures(n), done=n.phases.filter(f=>f.status==='x').length;
  const bits=[MACRO_STATE[n.state]||n.state];
  if(n.phases.length)bits.push(`phases ${done}/${n.phases.length}`);
  if(g.chats)bits.push([pl(g.chats,'chat'),pl(g.turns,'turn'),k(g.out),
    `$${g.usd.toFixed(2)}`].join(' · '));
  const rows=n.phases.map(f=>`<div class="mrow" data-mp="${f.n}">
      <span class="mk ${f.cls||''}">${f.icon||''}</span>
      <span class="t">${f.n} · ${esc(f.title)}${tagChips(f)}</span>
      <span class="w">${esc(f.run||'')}</span></div>`).join('')||
    '<p class="empty">no plan for this macro-phase yet — nothing to show</p>';
  const where=n.slug?`<p class="note">plan <code>${esc(n.slug)}</code>${
    n.branch?` · read from branch <code>${esc(n.branch)}</code>`:''}</p>`:'';
  const subnav=`<div class="subnav">
    <button data-ms="ov" aria-selected="${macroSub==='ov'}">Overview</button>
    <button data-ms="plan" aria-selected="${macroSub==='plan'}">Plan</button></div>`;
  const body=macroSub==='plan'?macroPlan(n):
    `${n.mini_scope?`<p class="note">${esc(n.mini_scope)}</p>`:''}
     ${n.ends_at?`<p class="note"><b>ends at</b> ${esc(n.ends_at)}</p>`:''}
     ${where}<h2>phases</h2>${rows}`;
  return `<div class="phead"><span class="t"><span class="mk ${n.cls}">${n.icon}</span>
      ${n.n!=null?`macro-phase ${n.n} — `:''}${esc(n.title)}</span>
    <span class="m note">${bits.join(' · ')}</span></div>${subnav}${body}`;
}

// A macro-phase is described twice, and neither text replaces the other: the
// roadmap says why it comes where it does and what it owes the macros after,
// its own plan.md says what it will build. Both here, roadmap first.
function macroPlan(n){
  // Two views, the same switch the phase pane uses: the roadmap says why this
  // macro comes where it does and what it owes the ones after, its own plan.md
  // says what it will build. Neither replaces the other, so neither is buried
  // under the other.
  const has={roadmap:n.n!=null, plan:!!n.slug};
  const view=has[macroPlanView]?macroPlanView:(has.roadmap?'roadmap':'plan');
  // `roadmap` and `detail` name the relation between the two texts — the
  // programme's view of this macro, and the macro's own. `roadmap` / `its own
  // plan` were two words for the same idea and left the reader to work out
  // which was which.
  const seg=[['roadmap','roadmap'],['plan','detail']].map(([v,lab])=>
    `<button data-mv="${v}" aria-selected="${view===v}"${has[v]?'':' disabled'}>${
      lab}</button>`).join('');
  let body;
  if(view==='plan'){
    body=has.plan?planBlock(n.slug,0):
      '<p class="empty">this macro-phase has no plan.md yet</p>';
  }else{
    const rm=planText['r:'+n.n];
    body=(rm===undefined||rm===null)?'<p class="empty">loading…</p>':
      (rm.missing||!rm.lines.length)?
        '<p class="empty">roadmap.md says nothing under this macro-phase</p>':
        `<div class="plan md">${mdRender(rm.lines.join('\n'),true)}</div>`;
  }
  return `<div class="pbar"><span class="seg">${seg}</span></div>${body}`;
}

function viewPhase(){
  if(macroSel)return viewMacro();
  const p=S.plan;
  // The slug settles it before the open plan does. A repo whose workflows are
  // all finalized has no open plan and a tree full of clickable phases: asking
  // `!p` first answered every one of them with the no-plan state.
  if(phaseSlug&&(!p||phaseSlug!==p.slug))return viewOtherPhase();
  if(!p)return viewNoPlan();
  const f=p.phases.find(x=>x.n===phase);
  if(!f)return '<p class="empty">no phase selected</p>';
  const g=figures(f.n), mk=f.icon, cls=f.cls||'';
  const bits=[STATE[f.status]||'',esc(f.run||'')].filter(Boolean);
  // The cost figure used to sit inside the run of numbers, in brackets. It is
  // the one thing on this line that is a measure and not a count, so it goes to
  // the end, drawn as the same bar the grid uses.
  let meter='';
  if(g.chats){
    const parts=[pl(g.chats,'chat'),pl(g.turns,'turn'),k(g.out)];
    if(g.out)parts.push(`reread/out ${Math.round(g.read/g.out)}`);
    parts.push(`$${g.usd.toFixed(2)}`);
    bits.push(parts.join(' · '));
    if(g.out)meter=costBar(g.read/g.out);
  }
  // The step bar rides beside the cost meter: the phase head is where the two
  // measures of a running phase belong, and neither is a count.
  const steps=f.status==='>'?stepsOf(f.n):null;
  if(f.status==='>'&&!steps)bits.push('no step declaration');
  const launch=f.n===p.next?launchRow(f.n):'';
  const subnav=`<div class="subnav">
    <button data-s="ov" aria-selected="${sub==='ov'}">Overview</button>
    <button data-s="plan" aria-selected="${sub==='plan'}">Plan</button>
    <button data-s="log" aria-selected="${sub==='log'}">Log</button>
    <button data-s="note" aria-selected="${sub==='note'}">Notes</button></div>`;
  let body='';
  if(sub==='ov'){
    const chats=chatsOf(f.n);
    body=chats.length?chats.map(c=>chatBlock(c,agCard(c,false))).join(''):
      '<p class="empty">no agent for this phase</p>';
    const att=phaseAlerts(f.n);
    if(att)body+=`<h2>needs attention</h2>${att}`;
    body+=`<h2>to verify</h2>${checkRows(f)}`;
  }else if(sub==='plan'){
    body=planBlock(phaseSlug||p.slug,f.n);
  }else if(sub==='log'){
    body=`<div id="logbox"><p class="empty">loading…</p></div>`;
  }else{
    body=notesOf(f);
  }
  return `<div class="phead"><span class="t"><span class="mk ${cls}">${mk}</span>
    phase ${f.n} — ${esc(f.title)}</span>
    <span class="m note">${bits.join(' · ')}${
      steps?` <span class="meter">${stepBar(steps)}</span>`:''}${
      meter?` <span class="meter">${meter}</span>`:''}</span></div>${launch}${subnav}${body}`;
}

// Two buttons, never one that guesses, and neither one runs anything: this
// page asks. Unattended queues the request for the Codex task that opened the
// dashboard, which invokes `/run-workflow` with everything that skill owns;
// the other road hands back the command, because a phase does not run in the
// chat that supervises it.
function launchRow(n){
  return `<div class="launch">
    <div class="wrow">
      <button class="go" id="lgo"${launching?' disabled':''}>${
        launching==='unattended'?'queueing…':'Ask for an unattended run'}</button>
      <button class="ghost" id="lchat"${launching?' disabled':''}>${
        'Command for phase '+n}</button>
      ${launchMsg?`<span class="st ${esc(launchCls)}">${esc(launchMsg)}</span>`:''}
    </div>
    ${launchCmd?`<div class="cmd"><code id="lcmd">${esc(launchCmd)}</code>
      <button id="lcopy">copy</button></div>`:''}
    <p class="note">The unattended request waits for the Codex task that opened this
      dashboard, which runs <code>/run-workflow</code> from phase ${n} on.
      The other button hands back <code>/execute-phase</code> to copy into a
      Codex task of its own — never this one.</p>
  </div>`;
}

// A launch takes no target and no phase number: the road is all the page says.
async function launchPhase(road){
  if(launching)return;
  launching=road;launchMsg='';launchCls='';launchCmd='';render();
  let j;
  try{j=await(await fetch('/api/launch',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({road:road})})).json();}
  catch(e){j={error:'the server did not answer'};}
  launching='';
  if(j.error){launchMsg=j.error;launchCls='err';launchCmd=j.command||'';}
  else if(j.queued){launchMsg='queued · the owning Codex task runs it';
    launchCls='ok';}
  else{launchMsg=`phase ${j.phase} — copy this into a Codex task of its own`;
    launchCls='';launchCmd=j.command||'';}
  render();
}

// The plan, verbatim. Not a rendering: the reason to open this is to compare
// what was written with what was built, and a rendering is what cannot serve
// that. Markdown stays markdown.
// The plan's own vocabulary, and nothing more: phase lines, `>` notes,
// `- Field:` lines, headings, bold and inline code. Used when the CDN is out
// of reach. Every line survives — a renderer that drops what it does not
// understand cannot be used to spot a discrepancy.
// A field's name is the word before the first colon, and only when it reads
// like a name: letters and spaces, short. `In execution since 2026-08-25T18:05`
// has a colon too, and it is not a label.
function labelled(rest,inline){
  const m=rest.match(/^([A-Za-z][A-Za-z ]{0,20}):\s*(.*)$/);
  return m?`<b>${esc(m[1])}:</b> ${inline(m[2])}`:inline(rest);
}

// The plan wraps its fields at 80 columns, so half a sentence arrives as its
// own line. The same rule `core.py` applies when it parses.
function joinWrapped(text){
  const lines=[];
  text.split('\n').forEach(line=>{
    const cont=/^\s{4,}\S/.test(line)&&!/^\s*[->]\s/.test(line)&&lines.length
      &&lines[lines.length-1].trim();
    if(cont)lines[lines.length-1]+=' '+line.trim();
    else lines.push(line);
  });
  return lines;
}

// The file writes the record first: `/close-phase` puts `> Done:` and the rest
// straight under the phase line, above the fields that were authored. Reading
// it in that order means meeting the outcome before the intention. The
// rendering groups them the other way — what was planned, then what happened —
// which is also the order in which a discrepancy shows itself. `raw` is there
// for whoever wants the file's own order.
function splitPhase(text){
  const head=[], planned=[], executed=[];
  joinWrapped(text).forEach(line=>{
    if(!line.trim())return;
    if(/^- \[.\]/.test(line))head.push(line);
    else if(/^\s*>/.test(line))executed.push(line);
    else planned.push(line);
  });
  return {head, planned, executed};
}

function miniMd(text){
  const inline=s=>esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return joinWrapped(text).map(line=>{
    if(!line.trim())return '';
    let m=line.match(/^#{1,6}\s+(.*)$/);
    if(m)return `<h3>${inline(m[1])}</h3>`;
    m=line.match(/^\s*- \[(.)\]\s+(.*)$/);
    if(m)return `<div class="pph"><span class="mk">${esc(m[1])}</span>${inline(m[2])}</div>`;
    m=line.match(/^\s*>\s?(.*)$/);
    if(m)return `<div class="pnote">${labelled(m[1],inline)}</div>`;
    m=line.match(/^\s*-\s+(.*)$/);
    if(m)return `<div class="pfield">${labelled(m[1],inline)}</div>`;
    m=line.match(/^([A-Z][A-Za-z ]{0,20}):\s*(.*)$/);
    if(m)return `<div class="pfield"><b>${esc(m[1])}:</b> ${inline(m[2])}</div>`;
    return `<div class="pline">${inline(line)}</div>`;
  }).join('');
}

// One renderer for both grains. A PHASE block is not prose — its marker line
// is a list item and its notes are indented lines under it — and the plan's
// HEADER is ordinary prose, but `miniMd` reads both: it escapes every byte
// through `esc()` and builds no `<a>` at all.
//
// The `prose` argument is kept because the callers distinguish the two grains
// and a vendored renderer would use it. Until one is vendored HERE, with its
// href scheme filtered, nothing on this page parses plan text into markup that
// can carry a destination: this origin owns the endpoints that queue a request
// for the chat watching this repository.
function mdRender(text,prose){
  return miniMd(text);
}

function planBlock(slug,n){
  const key=`${slug}:${n}`, got=planText[key];
  if(got===undefined||got===null)return '<p class="empty">loading…</p>';
  if(got.error)return `<p class="empty">${esc(got.error)}</p>`;
  if(got.missing||!got.lines.length)
    return `<p class="empty">the plan says nothing under phase ${n}</p>`;
  const text=got.lines.join('\n');
  // Two buttons, the current one selected: a single link showed the action and
  // read as a label of the mode you were already in.
  const part=splitPhase(text);
  const side=planView==='executed'?part.executed:part.planned;
  const seg=['planned','executed','raw'].map(v=>
    `<button data-pv="${v}" aria-selected="${planView===v}">${v}${
      v!=='raw'&&n?` <span class="c">${part[v].length}</span>`:''}</button>`).join('');
  if(planView==='raw'||!n)
    return `<div class="pbar"><span class="seg">${seg}</span></div>`+
      (planView==='raw'?`<pre class="plan">${esc(text)}</pre>`
                      :`<div class="plan md">${mdRender(text,!n)}</div>`);
  return `<div class="pbar"><span class="seg">${seg}</span></div>
    <div class="plan md ${planView}">${
      side.length?mdRender(part.head.concat(side).join('\n')):
      `<p class="empty">nothing under ${planView} for phase ${n}</p>`}</div>`;
}

function textStamp(key){
  const stamps=(S&&S.stamps)||{};
  if(key.startsWith('r:'))return stamps.roadmap??null;
  const slug=key.slice(0,key.lastIndexOf(':'));
  return (stamps.plans&&stamps.plans[slug])??null;
}

async function loadText(key,url){
  if(planLoading.has(key))return;
  const stamp=textStamp(key);
  if(planText[key]!==undefined&&planStamp[key]===stamp)return;
  planLoading.add(key);
  let j;
  try{j=await(await fetch(url)).json();}
  catch(e){j={error:'the server did not answer'};}
  planLoading.delete(key);
  planText[key]=j;planStamp[key]=stamp;render();
}

async function loadRoadmap(macro){
  return loadText('r:'+macro,'/api/roadmap?macro='+encodeURIComponent(macro));
}

async function loadPlanText(slug,n){
  return loadText(`${slug}:${n}`,`/api/plantext?slug=${
    encodeURIComponent(slug||'')}&phase=${n}`);
}

async function loadLog(n){
  const j=await(await fetch('/api/log?phase='+n)).json();
  logCache[n]=j;
  const box=document.getElementById('logbox');
  if(!box)return;
  if(!j.path){box.innerHTML='<p class="empty">no log for this phase — /run-workflow writes them</p>';return;}
  box.innerHTML=`<p class="note">${esc(j.path)} — ${j.total} lines, last ${j.lines.length}</p>
    <pre>${esc(j.lines.join('\n'))}</pre>`;
  const pre=box.querySelector('pre');pre.scrollTop=pre.scrollHeight;
}

// The mirror keeps the same surface over Codex's owner-scoped proposal queue.
// Codex exposes no stable local task transcript, so the durable queue is the
// only exchange this adapter may claim to have observed.
function viewMirror(){
  if(!S.plan)return '<p class="empty">no plan — the Foreman tab needs a foreman.json</p>';
  if(!mirror)return '<p class="empty">loading…</p>';
  if(mirror.error)return `<p class="empty">${esc(mirror.error)}</p>`;
  const off=!mirror.live;
  const talk=(mirror.exchange||[]).map(x=>`<div class="msg${
      x.role==='sent'?' sent':''}">
    <div class="who"><b>${x.role==='sent'?'you':'foreman'}</b>${
      x.role==='sent'?'<span>→ foreman</span>':''}
      <span class="w">${x.ts?ago(x.ts):''}</span></div>
    <div class="tx">${esc(x.text)}</div></div>`).join('')||
    '<p class="empty">nothing on this channel yet</p>';
  return `<div class="fmhead"><span class="dot${off?'':' on'}"></span>
      <span class="nm">${esc(shortName(mirror.title))}</span>
      <span class="st${off?' off':''}">${off?'unowned proposal queue':
        'proposal queue · task '+String(mirror.owner||'').slice(0,12)}</span></div>
    <div class="talk" id="talk">${talk}</div>
    <div class="writer">
      <textarea id="fmtext"${off?' disabled':''} placeholder="${off?
        'the dashboard has no owning Codex task — nothing can be queued':
        'write to the foreman…'}">${esc(draft)}</textarea>
      <div class="wrow">
        <span class="st ${off?'err':esc(sendCls)}">${esc(off?shortName(mirror.state):sendMsg)}</span>
        <button class="go" id="fmsend"${off||sending||!draft.trim()?' disabled':''}>${
          sending?'queueing…':'queue'}</button>
      </div>${off?'<p class="note" style="margin-top:12px">Codex exposes no stable '+
        'task transcript to local plugins. The durable proposal queue remains '+
        'the transport record.</p>':''}</div>`;
}

async function loadMirror(){
  try{mirror=await(await fetch('/api/mirror')).json();}catch(e){return;}
  if(pane==='mirror'&&level==='plan')render();
}

// Nothing is delivered from here: what comes back says the request was
// queued, and the Codex task that opened the dashboard is what carries it out.
function sendVerdict(j){
  if(j.error)return [j.error,'err'];
  return ['queued · the owning Codex task delivers it','ok'];
}

async function sendForeman(){
  const text=draft.trim();
  if(!text||sending)return;
  sending=true;sendMsg='queueing…';sendCls='';render();
  let j;
  try{j=await(await fetch('/api/foreman',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text})})).json();}
  catch(e){j={error:'the server did not answer'};}
  sending=false;
  [sendMsg,sendCls]=sendVerdict(j);
  if(!j.error)draft='';
  render();loadMirror();
}

async function loadSessions(){
  try{const j=await(await fetch('/api/sessions')).json();nf.owner=j.owner||null;}
  catch(e){nf.owner=null;}
  renderDialog();
}

async function sendNewFlow(){
  if(nf.sending||!nf.name.trim())return;
  nf.sending=true;nf.msg='queueing…';nf.cls='';renderDialog();
  // The body carries no recipient at all: the queue is the repository's, and
  // the Codex task that drains it is the one that opened this dashboard.
  const body={name:nf.name,scope:nf.scope};
  let j;
  try{j=await(await fetch('/api/newflow',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)})).json();}
  catch(e){j={error:'the server did not answer'};}
  nf.sending=false;
  const [msg,cls]=sendVerdict(j);
  nf.msg=j.error?msg:`${esc(j.command)} · ${msg}`;nf.cls=cls;
  renderDialog();
  if(j.error)loadSessions();
}

function viewActive(){
  if(S.totals.available===false)
    return '<p class="empty">Codex does not expose stable task activity or todo telemetry to local plugins.</p>';
  const rows=[];
  S.chats.forEach(c=>{
    const subs=c.subagents.filter(s=>s.active);
    if(c.active)rows.push(agCard(c,false));
    subs.forEach(s=>rows.push(agCard(s,true)));
  });
  return `<p class="note">Only agents touched in the last 120 s.</p>`+
    (rows.length?rows.join(''):'<p class="empty">no active agent</p>');
}

function viewOffPlan(){
  const off=S.chats.filter(c=>S.groups.off_plan.includes(c.session_id));
  const q=offFilter.toLowerCase();
  // A chat is kept when its own span overlaps the window, not when it started
  // inside it: a chat opened a fortnight ago and written to today belongs to
  // today as much as to that day.
  const inWindow=c=>{
    const a=dayOf(c.started)||dayOf(c.last), b=dayOf(c.last)||a;
    if(offFrom&&b&&b<offFrom)return false;
    if(offTo&&a&&a>offTo)return false;
    return true;};
  const hit=c=>(!q||[c.name,c.task,c.plan_slug].some(v=>(v||'').toLowerCase().includes(q)))
    &&inWindow(c);
  const shown=off.filter(hit);
  if(offSel&&!shown.some(c=>c.session_id===offSel))offSel=null;
  const rows=shown.map(c=>offRow(c)).join('');
  const picked=shown.find(c=>c.session_id===offSel);
  const detail=picked?
    agCard(picked,false)+(picked.subagents||[]).map(s=>agCard(s,true)).join('')+
      ((picked.subagents||[]).length?'':'<p class="empty">this chat spawned no subagent</p>'):
    '<p class="empty">pick a chat above</p>';
  return `<div class="offtop"><div class="offhead">
    <p class="note">One row per chat that worked in this repo without carrying
      a phase of this plan: your own chats, the chats of the repo's other plans,
      and their subagents. Their money is in the header total; their figures
      never enter a phase.</p>
    <div class="offbar">
      <input type="search" id="fq" value="${esc(offFilter)}"
        placeholder="filter ${off.length} agents — name, task, plan">
      <label>from <input type="date" id="ffrom" value="${esc(offFrom)}"></label>
      <label>to <input type="date" id="fto" value="${esc(offTo)}"></label>
      ${(offFrom||offTo)?'<a id="fclear">clear</a>':''}
    </div></div>
    <div class="offlist"><table class="grid offgrid">
      <thead><tr><th>chat</th><th class="wide">started</th>
        <th>last</th><th class="n wide">turns</th><th class="n">$</th>
        <th class="n">subs</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="empty">nothing here</td></tr>'}</tbody>
    </table></div></div>
    <div class="offdet">${detail}</div>`;
}

function offRow(c){
  // The same grid idiom as the plan: one line per chat, the chat cell taking
  // the leftover width and ellipsizing. What was behind a caret is in the
  // detail below now, so the row only says how many there are.
  const n=(c.subagents||[]).length;
  return `<tr class="${c.session_id===offSel?'selected':''}"
      data-off="${esc(c.session_id)}">
    <td class="ttl"><span class="dot${c.active?' on':''}"></span><b>${
      esc(shortName(c.name))}</b>${c.task?` <span class="note">${esc(c.task)}${
      c.plan_slug?' · '+esc(c.plan_slug):''}</span>`:''}</td>
    <td class="wide st">${stamp(c.started)}</td>
    <td class="st">${stamp(c.last)}</td>
    <td class="n wide">${c.turns}</td>
    <td class="n">${c.usd.toFixed(2)}</td>
    <td class="n">${n||'—'}</td></tr>`;
}

function viewAlerts(){
  return S.alerts.length?S.alerts.map(a=>
    `<div class="al ${a.level}">${esc(a.text)}</div>`).join(''):
    '<p class="empty">nothing to report</p>';
}

// The pane is rebuilt whole on every poll, so anything being typed into it
// would lose focus every five seconds. What had it is put back afterwards.
function focused(){
  const a=document.activeElement;
  if(!a||!a.id)return null;
  try{return {id:a.id,a:a.selectionStart,b:a.selectionEnd};}
  catch(e){return {id:a.id};}
}
function refocus(k){
  if(!k)return;
  const el=document.getElementById(k.id);
  if(!el)return;
  el.focus();
  if(k.a==null)return;
  try{el.setSelectionRange(k.a,k.b);}catch(e){}
}

function render(){
  if(!S)return;
  const keep=focused();
  if(level==='done'&&!archivedNodes().length)level='plan';
  head();grid();nav();
  const off=(level==='off');
  document.querySelector('.gridwrap').hidden=off;
  document.getElementById('panenav').hidden=off;
  document.getElementById('panebody').hidden=off;
  document.getElementById('offbody').hidden=!off;
  const el=document.getElementById(off?'offbody':'panebody');
  // Only the mirror splits the pane: its exchange scrolls, its writer does not.
  el.classList.toggle('split',!off&&pane==='mirror');
  el.innerHTML=off?viewOffPlan():({phase:viewPhase,mirror:viewMirror,
    active:viewActive,alerts:viewAlerts})[pane]();
  el.querySelectorAll('tr[data-off]').forEach(r=>
    r.onclick=()=>{offSel=(offSel===r.dataset.off)?null:r.dataset.off;render();});
  el.querySelectorAll('[data-chat]').forEach(b=>
    b.onclick=()=>{const id=b.dataset.chat;
      openChats.has(id)?openChats.delete(id):openChats.add(id);render();});
  el.querySelectorAll('.mrow[data-mp]').forEach(r=>
    r.onclick=()=>{const n=(S.tree.nodes||[]).find(x=>nodeKey(x)===macroSel);
      macroSel=null;phase=+r.dataset.mp;phaseSlug=n?n.slug:null;render();});
  el.querySelectorAll('.subnav button').forEach(b=>
    b.onclick=()=>{sub=b.dataset.s;render();});
  const tx=document.getElementById('fmtext');
  if(tx){
    // Empty or not is what enables the button, so only that flip redraws.
    tx.oninput=()=>{const had=!!draft.trim();draft=tx.value;
      if(had!==!!draft.trim())render();};
    tx.onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){
      e.preventDefault();draft=tx.value;sendForeman();}};
  }
  const fs=document.getElementById('fmsend');
  if(fs)fs.onclick=sendForeman;
  const talk=document.getElementById('talk');
  if(talk&&mirror){
    // The pane is rebuilt on every poll, which would drop the exchange back to
    // the top every five seconds. It keeps its place, and only a NEW message
    // takes it to the bottom.
    const n=(mirror.exchange||[]).length;
    if(n!==talkLen){talkLen=n;talk.scrollTop=talk.scrollHeight;}
    else talk.scrollTop=talkTop;
    talk.onscroll=()=>{talkTop=talk.scrollTop;};
  }
  const op=document.getElementById('nfopen');
  if(op)op.onclick=()=>{nf.msg='';nf.cls='';
    const d=document.getElementById('nfdlg');
    d.showModal();renderDialog();loadSessions();};
  const lgo=document.getElementById('lgo');
  if(lgo)lgo.onclick=()=>launchPhase('unattended');
  const lch=document.getElementById('lchat');
  if(lch)lch.onclick=()=>launchPhase('chat');
  const lcp=document.getElementById('lcopy');
  if(lcp)lcp.onclick=async()=>{
    try{await navigator.clipboard.writeText(launchCmd);lcp.textContent='copied';}
    catch(e){getSelection().selectAllChildren(document.getElementById('lcmd'));
      lcp.textContent='select and copy';}};
  el.querySelectorAll('[data-pv]').forEach(a=>
    a.onclick=()=>{planView=a.dataset.pv;render();});
  if(pane==='phase'&&sub==='log'&&phase!=null)loadLog(phase);
  if(pane==='phase'&&sub==='plan'&&phase!=null&&!macroSel)
    loadPlanText(phaseSlug||(S.plan&&S.plan.slug),phase);
  el.querySelectorAll('.subnav button[data-ms]').forEach(b=>
    b.onclick=()=>{macroSub=b.dataset.ms;render();});
  el.querySelectorAll('[data-mv]').forEach(b=>
    b.onclick=()=>{macroPlanView=b.dataset.mv;render();});
  if(macroSel&&macroSub==='plan'){
    const mn=(S.tree.nodes||[]).find(x=>nodeKey(x)===macroSel);
    if(mn){if(mn.slug)loadPlanText(mn.slug,0);
           if(mn.n!=null)loadRoadmap(mn.n);}}
  const fq=document.getElementById('fq');
  if(fq)fq.oninput=()=>{offFilter=fq.value;render();};
  const ff=document.getElementById('ffrom');
  if(ff)ff.onchange=()=>{offFrom=ff.value;render();};
  const ft=document.getElementById('fto');
  if(ft)ft.onchange=()=>{offTo=ft.value;render();};
  const fc=document.getElementById('fclear');
  if(fc)fc.onclick=()=>{offFrom=offTo='';render();};
  refocus(keep);
}

function pickPhase(){
  const p=S.plan;
  if(!p||phase!=null)return;
  const bad=p.phases.find(f=>'!~>'.includes(f.status));
  phase=(bad&&bad.n)??p.next??(p.phases[0]&&p.phases[0].n)??null;
  phaseSlug=p.slug;
}

async function tick(){
  try{
    S=await(await fetch('/api/state')).json();
    pickPhase();render();
    if(pane==='mirror'&&level==='plan')loadMirror();
    document.getElementById('clock').textContent=
      new Date().toLocaleTimeString('en-GB')+' · 5s';
  }catch(e){
    document.getElementById('clock').textContent='server unreachable';
  }
}
tick();setInterval(tick,5000);
</script>
</body>
</html>
